services:
  # run with the command
  # DB_NAME_AAA=aaa_db docker compose -f compose.yaml --project-name aaa_db up -d
  aaa_db:
    image: 'postgres:latest'
    environment:
      POSTGRES_DB: ${DB_NAME_AAA}
      POSTGRES_PASSWORD: ${DB_NAME_AAA}
      POSTGRES_USER: ${DB_NAME_AAA}
    ports:
      - "5432:5432"
